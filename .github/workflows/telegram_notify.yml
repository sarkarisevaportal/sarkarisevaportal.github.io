name: Send Sarkari Updates to Telegram

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sarkari-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
      OWN_SITE: "https://sarkarisevaportal.github.io/"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: One-time state synchronization
        run: |
          if [ ! -f ".state_version" ] || [ "$(cat .state_version)" != "v12" ]; then
            echo "Synchronizing state files..."
            rm -f last_*.txt history_*.json
            echo "v12" > .state_version
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git diff --cached --quiet || (git commit -m "Reset state for v12 direct universal logic" && git pull --rebase origin main && git push)
          fi

      - name: Fetch Blogger RSS and Notify
        run: |
          RESULT=$(python3 - <<'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          import time

          url = "https://www.indiagovtjobs.in/feeds/posts/default"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          root = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  resp = urllib.request.urlopen(req, timeout=20)
                  root = ET.parse(resp).getroot()
                  break
              except Exception:
                  if attempt < 3:
                      time.sleep(5)
          if root is None:
              exit(0)
          ns = {'atom': 'http://www.w3.org/2005/Atom'}
          entry = root.find('atom:entry', ns)
          if entry is None:
              exit(0)
          title = entry.find('atom:title', ns).text
          link = entry.find("atom:link[@rel='alternate']", ns).get('href')
          history = []
          if os.path.exists("history_BLOGGER.json"):
              import json
              try:
                  history = json.load(open("history_BLOGGER.json"))
              except Exception:
                  history = []
          if link in history:
              exit(0)
          import json
          history = [link] + history
          json.dump(history[:60], open("history_BLOGGER.json", "w"))
          print(f"{title}||{link}")
          EOF
          )
          if [ -n "$RESULT" ]; then
            TITLE="${RESULT%%||*}"
            LINK="${RESULT##*||}"
            MESSAGE="🆕 *New Update!*%0A%0A📰 Website: *Sarkari Jobs*%0A📝 Update: ${TITLE}%0A%0A📢 ${OWN_SITE}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHANNEL_USERNAME}" -d "text=${MESSAGE}" -d "parse_mode=Markdown" > /dev/null
            echo "Sent Blogger update: $TITLE"
          else
            echo "No new Blogger post."
          fi

      - name: Fetch all recruitment boards reliably
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, re, os, json, time

          # Direct official sources & robust boards list
          BOARDS = {
              'UPSC': ('https://jkinfo.in/page.php?b=UPSC', '🏛️', 'UPSC'),
              'SSC': ('https://jkinfo.in/page.php?b=SSCNWR', '📝', 'SSC (North Western Region)'),
              'IBPS': ('https://jkinfo.in/page.php?b=IBPS', '🏦', 'IBPS'),
              'NTA': ('https://jkinfo.in/page.php?b=CBSENET', '🎓', 'NTA'),
              'JKSSB': ('https://jkinfo.in/page.php?b=JKSSB', '📌', 'JKSSB'),
              'JKPSC': ('https://jkinfo.in/page.php?b=JKPSC', '🏢', 'JKPSC'),
              'JKHC': ('https://jkinfo.in/page.php?b=JKHC', '⚖️', 'J&K High Court'),
              'JammuUniv': ('https://jkinfo.in/page.php?b=JU', '🎓', 'University of Jammu'),
              'KashmirUniv': ('https://jkinfo.in/page.php?b=KU', '🎓', 'University of Kashmir'),
              'CentralUnivJammu': ('https://jkinfo.in/page.php?b=CUJammu', '🎓', 'Central University Jammu'),
              'CentralUnivKashmir': ('https://jkinfo.in/page.php?b=CUK', '🎓', 'Central University Kashmir'),
              'BGSBU': ('https://jkinfo.in/page.php?b=BGSBU', '🎓', 'BGSB University'),
              'SMVDU': ('https://jkinfo.in/page.php?b=SMVDU', '🎓', 'SMVD University'),
              'IUST': ('https://jkinfo.in/page.php?b=IUST', '🎓', 'IUST'),
              'SKUAST_Jammu': ('https://jkinfo.in/page.php?b=SKUASTJ', '🎓', 'SKUAST Jammu'),
              'SKUAST_Kashmir': ('https://jkinfo.in/page.php?b=SKUASTK', '🎓', 'SKUAST Kashmir'),
              'KVS': ('https://kvsangathan.nic.in/announcements', '🏫', 'KVS'),
              'SBI': ('https://www.sbi.co.in/web/careers/current-openings', '🏦', 'SBI'),
              'RRB_Jammu': ('https://www.rrbjammu.nic.in/', '🚆', 'RRB Jammu'),
              'EMRS': ('https://nests.tribal.gov.in/show_content.php?lang=1&level=1&ls_id=364&lid=148', '🏫', 'EMRS'),
              'NVS': ('https://navodaya.gov.in/nvs/en/Recruitment/Notification-Vacancies/', '🏫', 'NVS')
          }

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          HISTORY_LIMIT = 60
          MAX_PER_BOARD = 2
          
          # Strict filter to ignore navigation/footer junk links
          IGNORE_WORDS = {
              'terms of service', 'privacy policy', 'home', 'contact us', 'about us', 
              'download app', 'android app', 'disclaimer', 'sitemap', 'feedback',
              'login', 'register', 'contact', 'about', 'help', 'faq', 'terms',
              'notification', 'notifications', 'recruitment', 'vacancies', 'view', 
              'click here', 'read more', 'skip to main content', 'screen reader'
          }

          def fetch(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      resp = urllib.request.urlopen(req, timeout=25)
                      return resp.read().decode('utf-8', errors='ignore')
                  except Exception:
                      if attempt < 2:
                          time.sleep(4)
              return ''

          def clean_title(raw):
              clean = re.sub(r'\s+', ' ', re.sub(r'<[^<]+?>', '', raw)).strip()
              return clean

          def load_history(name):
              path = f'history_{name}.json'
              if os.path.exists(path):
                  try:
                      return json.load(open(path))
                  except Exception:
                      return []
              return []

          def save_history(name, links):
              seen = set()
              deduped = []
              for l in links:
                  if l not in seen:
                      seen.add(l)
                      deduped.append(l)
              json.dump(deduped[:HISTORY_LIMIT], open(f'history_{name}.json', 'w'))

          all_results = []

          for name, (url, emoji, label) in BOARDS.items():
              html = fetch(url)
              if not html:
                  continue

              matches = re.findall(r'<a\s+[^>]*href=[\'\"]([^\'\"]+)[\'\"][^>]*>(.*?)</a>', html, re.I | re.S)
              history = load_history(name)
              hist_set = set(history)
              
              board_new_count = 0
              new_links_for_history = []

              for link, raw_title in matches:
                  title = clean_title(raw_title)
                  # Validation: title length should be meaningful and not in ignore list
                  if not link or link.strip().startswith(('#', 'javascript', 'mailto', 'tel:')):
                      continue
                  if len(title) < 15 or title.lower() in IGNORE_WORDS:
                      continue
                  if any(bad in title.lower() for bad in ['privacy policy', 'terms of service', 'sitemap', 'cookie policy']):
                      continue

                  full_link = urllib.parse.urljoin(url, link)
                  
                  if full_link not in new_links_for_history and full_link not in hist_set:
                      new_links_for_history.append(full_link)
                      if board_new_count < MAX_PER_BOARD:
                          all_results.append({
                              'name': name,
                              'emoji': emoji,
                              'label': label,
                              'title': title,
                              'link': full_link
                          })
                          board_new_count += 1

              if new_links_for_history:
                  save_history(name, new_links_for_history + history)

          json.dump(all_results, open('notify_results.json', 'w'))
          PYEOF

      - name: Send notifications to Telegram
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse, time
          if os.path.exists('notify_results.json'):
              try:
                  data = json.load(open('notify_results.json'))
                  token = os.environ.get('BOT_TOKEN')
                  channel = os.environ.get('CHANNEL_USERNAME')
                  own_site = os.environ.get('OWN_SITE')
                  for r in data:
                      msg = f"🆕 *New Update!*\n\n{r['emoji']} Website: *{r['label']}*\n📝 Update: {r['title']}\n\n🔗 {r['link']}\n\n📢 {own_site}"
                      encoded_msg = urllib.parse.quote(msg)
                      tg_url = f"https://api.telegram.org/bot{token}/sendMessage?chat_id={channel}&text={encoded_msg}&parse_mode=Markdown"
                      try:
                          urllib.request.urlopen(tg_url, timeout=10)
                      except Exception as e:
                          print(f"Failed to send: {e}")
                      time.sleep(1.5)
              except Exception as e:
                  print(f"Error sending notifications: {e}")
          PYEOF

      - name: Commit updated history files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add history_*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update universal board notification history"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "No history changes to commit."
          fi

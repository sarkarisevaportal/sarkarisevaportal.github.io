name: Send Sarkari Updates to Telegram
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
      OWN_SITE: "https://sarkarisevaportal.github.io/"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve DNS via Google (workaround for runner DNS issues)
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=www.indiagovtjobs.in&type=A" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['Answer'][0]['data'])" 2>/dev/null || true)
          if [ -n "$IP" ]; then
            echo "Resolved www.indiagovtjobs.in -> $IP"
            echo "$IP www.indiagovtjobs.in" | sudo tee -a /etc/hosts
          else
            echo "Could not resolve via Google DoH, will rely on system DNS + retries"
          fi

      - name: Fetch Blogger RSS and Notify
        run: |
          RESULT=$(python3 - <<'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          import time

          url = "https://www.indiagovtjobs.in/feeds/posts/default"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; SarkariSevaBot/1.0)"}

          root = None
          last_error = None
          for attempt in range(6):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  resp = urllib.request.urlopen(req, timeout=20)
                  root = ET.parse(resp).getroot()
                  break
              except Exception as e:
                  last_error = e
                  if attempt < 5:
                      time.sleep(10)

          if root is None:
              print(f"FAILED_FETCH: {last_error}")
              exit(0)

          ns = {'atom': 'http://www.w3.org/2005/Atom'}
          entry = root.find('atom:entry', ns)
          title = entry.find('atom:title', ns).text
          link = entry.find("atom:link[@rel='alternate']", ns).get('href')

          if os.path.exists("last_link.txt"):
              with open("last_link.txt", "r") as f:
                  if f.read().strip() == link:
                      exit(0)

          with open("last_link.txt", "w") as f:
              f.write(link)
          print(f"{title}||{link}")
          EOF
          )

          if [[ "$RESULT" == FAILED_FETCH:* ]]; then
            echo "Fetch failed after retries: $RESULT"
            RESULT=""
          fi

          if [ -n "$RESULT" ]; then
            TITLE="${RESULT%%||*}"
            LINK="${RESULT##*||}"
            MESSAGE="🚨 *Nayi Sarkari Update Aayi Hai!*%0A%0A${TITLE}%0A%0A🔗 ${LINK}%0A%0A📢 Aur updates: ${OWN_SITE}"

            TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHANNEL_USERNAME}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown")
            echo "Telegram API response (Blogger): $TG_RESPONSE"
          else
            echo "No new Blogger post found. Skipping."
          fi

      - name: Fetch all boards (UPSC/SSC/IBPS/NTA/JKSSB/JKHC/SBI/RRB/EMRS/KVS/NVS)
        run: |
          python3 - <<'EOF'
          import urllib.request
          import urllib.parse
          import re
          import os
          import time
          import json

          jkinfo_boards = {
              "UPSC": "https://www.jkinfo.in/page.php?b=UPSC",
              "SSC": "https://www.jkinfo.in/page.php?b=SSCNWR",
              "IBPS": "https://www.jkinfo.in/page.php?b=IBPS",
              "NTA": "https://www.jkinfo.in/page.php?b=CBSENET",
              "JKSSB": "https://www.jkinfo.in/page.php?b=JKSSB",
              "JKHC": "https://www.jkinfo.in/page.php?b=JKHC",
          }
          generic_boards = {
              "SBI": "https://www.sbi.co.in/careers/current-openings",
              "RRB_Jammu": "https://www.rrbjammu.nic.in/",
              "RRB_Central": "https://www.rrcb.gov.in/",
              "EMRS": "https://nests.tribal.gov.in/show_content.php?lang=1&level=1&ls_id=364&lid=148",
              "KVS": "https://kvsangathan.nic.in/en/notification/",
              "NVS": "https://navodaya.gov.in/nvs/en/Recruitment/Notification-Vacancies/",
          }

          headers = {"User-Agent": "Mozilla/5.0 (compatible; SarkariSevaBot/1.0)"}
          BAD_TITLES = {
              "list of websites", "home", "contact us", "about us", "download app",
              "android app", "privacy policy", "disclaimer", "sitemap", "feedback",
              "login", "register", "contact", "about", "help", "faq", "terms",
              "notification", "notifications", "recruitment", "vacancies",
          }

          def fetch(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      resp = urllib.request.urlopen(req, timeout=20)
                      return resp.read().decode("utf-8", errors="ignore")
                  except Exception:
                      if attempt < 3:
                          time.sleep(8)
              return None

          def is_valid(link, title):
              if not link or link.strip() in ("#", "", "javascript:void(0)"):
                  return False
              if not link.startswith("http") and not link.startswith("/"):
                  return False
              clean = re.sub(r'<[^<]+?>', '', title).strip().lower()
              if len(clean) < 10 or clean in BAD_TITLES:
                  return False
              return True

          def best_match(html, pattern):
              """Pick the first valid match; prefer one flagged as NEW nearby."""
              candidates = []
              for m in re.finditer(pattern, html, re.S):
                  link, title = m.group(1), m.group(2)
                  if is_valid(link, title):
                      trailing = html[m.end(): m.end() + 150]
                      is_new = bool(re.search(r'\(?\bNEW\b\)?', trailing, re.I))
                      candidates.append((is_new, link, title))
                  if len(candidates) >= 15:
                      break
              if not candidates:
                  return None
              for is_new, link, title in candidates:
                  if is_new:
                      return link, title
              return candidates[0][1], candidates[0][2]

          def save_if_new_and_notify(name, link, title, base_url):
              state_file = f"last_{name}.txt"
              prev = None
              if os.path.exists(state_file):
                  with open(state_file) as f:
                      prev = f.read().strip()
              if prev == link:
                  return None
              with open(state_file, "w") as f:
                  f.write(link)

              clean_title = re.sub(r'\s+', ' ', re.sub(r'<[^<]+?>', '', title)).strip()
              pdf_path = None
              try:
                  req = urllib.request.Request(link, headers=headers)
                  resp = urllib.request.urlopen(req, timeout=25)
                  ctype = resp.headers.get("Content-Type", "")
                  if "pdf" in ctype.lower() or link.lower().endswith(".pdf"):
                      data = resp.read()
                      pdf_path = f"pdf_{name}.pdf"
                      with open(pdf_path, "wb") as pf:
                          pf.write(data)
              except Exception:
                  pdf_path = None

              return {"name": name, "title": clean_title, "link": link, "pdf": pdf_path}

          results = []

          for name, url in jkinfo_boards.items():
              html = fetch(url)
              if not html:
                  continue
              match = best_match(html, r'<a\s+href="([^"]+)"[^>]*>\s*<b>(.*?)</b>')
              if not match:
                  continue
              link, title = match
              link = urllib.parse.urljoin(url, link)
              r = save_if_new_and_notify(name, link, title, url)
              if r:
                  results.append(r)

          for name, url in generic_boards.items():
              html = fetch(url)
              if not html:
                  continue
              match = best_match(html, r'<a\s+href="([^"]+)"[^>]*>\s*([^<]{15,200})</a>')
              if not match:
                  continue
              link, title = match
              link = urllib.parse.urljoin(url, link)
              r = save_if_new_and_notify(name, link, title, url)
              if r:
                  results.append(r)

          with open("notify_results.json", "w") as f:
              json.dump(results, f)

          print(f"Found {len(results)} new updates")
          EOF

          if [ -f notify_results.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('notify_results.json'))))")
            echo "New updates to send: $COUNT"

            python3 -c "
          import json
          data = json.load(open('notify_results.json'))
          for i, r in enumerate(data):
              print(f'{i}|{r[\"name\"]}|{r[\"title\"]}|{r[\"link\"]}|{r[\"pdf\"] or \"\"}')
          " > notify_lines.txt

            while IFS='|' read -r IDX NAME TITLE LINK PDF; do
              [ -z "$NAME" ] && continue
              CAPTION=$(printf '🚨 *Nayi Update Aayi Hai!*\n\n*%s*\n%s\n\n📢 Aur updates: %s' "$NAME" "$TITLE" "$OWN_SITE")

              if [ -n "$PDF" ] && [ -f "$PDF" ]; then
                TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
                  -F "chat_id=${CHANNEL_USERNAME}" \
                  -F "caption=${CAPTION}" \
                  -F "parse_mode=Markdown" \
                  -F "document=@${PDF}")
                echo "Telegram API response (${NAME}, PDF): $TG_RESPONSE"
              else
                MESSAGE="🚨 *Nayi Update Aayi Hai!*%0A%0A*${NAME}*%0A${TITLE}%0A%0A🔗 ${LINK}%0A%0A📢 Aur updates: ${OWN_SITE}"
                TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${CHANNEL_USERNAME}" \
                  -d "text=${MESSAGE}" \
                  -d "parse_mode=Markdown")
                echo "Telegram API response (${NAME}, link): $TG_RESPONSE"
              fi
            done < notify_lines.txt
          else
            echo "No new board updates found."
          fi

      - name: Commit updated state files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_link.txt last_UPSC.txt last_SSC.txt last_IBPS.txt last_NTA.txt last_JKSSB.txt last_JKHC.txt last_SBI.txt last_RRB_Jammu.txt last_RRB_Central.txt last_EMRS.txt last_KVS.txt last_NVS.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update last posted links" && git push)

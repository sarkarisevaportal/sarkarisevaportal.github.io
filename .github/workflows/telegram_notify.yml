name: Send Sarkari Updates to Telegram
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
      OWN_SITE: "https://sarkarisevaportal.github.io/"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve DNS via Google (workaround for runner DNS issues)
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=www.indiagovtjobs.in&type=A" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['Answer'][0]['data'])" 2>/dev/null || true)
          if [ -n "$IP" ]; then
            echo "Resolved www.indiagovtjobs.in -> $IP"
            echo "$IP www.indiagovtjobs.in" | sudo tee -a /etc/hosts
          else
            echo "Could not resolve via Google DoH, will rely on system DNS + retries"
          fi

      - name: Fetch Blogger RSS and Notify
        run: |
          RESULT=$(python3 - <<'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          import time

          url = "https://www.indiagovtjobs.in/feeds/posts/default"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; SarkariSevaBot/1.0)"}

          root = None
          last_error = None
          for attempt in range(6):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  resp = urllib.request.urlopen(req, timeout=20)
                  root = ET.parse(resp).getroot()
                  break
              except Exception as e:
                  last_error = e
                  if attempt < 5:
                      time.sleep(10)

          if root is None:
              print(f"FAILED_FETCH: {last_error}")
              exit(0)

          ns = {'atom': 'http://www.w3.org/2005/Atom'}
          entry = root.find('atom:entry', ns)
          title = entry.find('atom:title', ns).text
          link = entry.find("atom:link[@rel='alternate']", ns).get('href')

          if os.path.exists("last_link.txt"):
              with open("last_link.txt", "r") as f:
                  if f.read().strip() == link:
                      exit(0)

          with open("last_link.txt", "w") as f:
              f.write(link)
          print(f"{title}||{link}")
          EOF
          )

          if [[ "$RESULT" == FAILED_FETCH:* ]]; then
            echo "Fetch failed after retries: $RESULT"
            RESULT=""
          fi

          if [ -n "$RESULT" ]; then
            TITLE="${RESULT%%||*}"
            LINK="${RESULT##*||}"
            MESSAGE="📌 *Nayi Sarkari Update*%0A%0A${TITLE}%0A%0A📄 Notification: ${LINK}%0A🌐 Source: indiagovtjobs.in%0A📢 More updates: ${OWN_SITE}"

            TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHANNEL_USERNAME}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown")
            echo "Telegram API response (Blogger): $TG_RESPONSE"
          else
            echo "No new Blogger post found. Skipping."
          fi

      - name: Fetch UPSC/SSC/IBPS/NTA/SBI/RRB updates and Notify
        run: |
          RESULTS=$(python3 - <<'EOF'
          import urllib.request
          import urllib.parse
          import re
          import os
          import time

          jkinfo_boards = {
              "UPSC": ("https://www.jkinfo.in/page.php?b=UPSC", "https://upsc.gov.in/"),
              "SSC": ("https://www.jkinfo.in/page.php?b=SSCNWR", "https://ssc.nic.in/"),
              "IBPS": ("https://www.jkinfo.in/page.php?b=IBPS", "https://www.ibps.in/"),
              "NTA": ("https://www.jkinfo.in/page.php?b=CBSENET", "https://nta.ac.in/"),
              "JKSSB": ("https://www.jkinfo.in/page.php?b=JKSSB", "https://jkssb.nic.in/"),
              "JKHC": ("https://www.jkinfo.in/page.php?b=JKHC", "https://jkhighcourt.nic.in/"),
          }
          generic_boards = {
              "SBI": ("https://www.sbi.co.in/careers/current-openings", "https://www.sbi.co.in/careers"),
              "RRB_Jammu": ("https://www.rrbjammu.nic.in/", "https://www.rrbjammu.nic.in/"),
              "RRB_Central": ("https://www.rrcb.gov.in/", "https://www.rrcb.gov.in/"),
          }

          headers = {"User-Agent": "Mozilla/5.0 (compatible; SarkariSevaBot/1.0)"}
          out_lines = []

          def fetch(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      resp = urllib.request.urlopen(req, timeout=20)
                      return resp.read().decode("utf-8", errors="ignore")
                  except Exception:
                      if attempt < 3:
                          time.sleep(8)
              return None

          def save_if_new(name, link, title, source_site, out_lines):
              state_file = f"last_{name}.txt"
              prev = None
              if os.path.exists(state_file):
                  with open(state_file) as f:
                      prev = f.read().strip()
              if prev != link:
                  with open(state_file, "w") as f:
                      f.write(link)
                  out_lines.append(f"{name}||{title}||{link}||{source_site}")

          BAD_TITLES = {
              "list of websites", "home", "contact us", "about us", "download app",
              "android app", "privacy policy", "disclaimer", "sitemap", "feedback",
              "login", "register", "contact", "about", "help", "faq", "terms",
          }

          def is_valid_match(link, title):
              if not link or link.strip() in ("#", "", "javascript:void(0)"):
                  return False
              if not link.startswith("http") and not link.startswith("/"):
                  return False
              clean_title = re.sub(r'<[^<]+?>', '', title).strip().lower()
              if len(clean_title) < 10:
                  return False
              if clean_title in BAD_TITLES:
                  return False
              return True

          def first_valid_match(matches):
              for link, title in matches:
                  if is_valid_match(link, title):
                      return link, title
              return None

          for name, (url, source_site) in jkinfo_boards.items():
              html = fetch(url)
              if not html:
                  continue
              matches = re.findall(r'<a\s+href="([^"]+)"[^>]*>\s*<b>(.*?)</b>', html, re.S)
              result = first_valid_match(matches)
              if not result:
                  continue
              link, title = result
              link = urllib.parse.urljoin(url, link)
              title = re.sub(r'<[^<]+?>', '', title).strip()
              save_if_new(name, link, title, source_site, out_lines)

          for name, (url, source_site) in generic_boards.items():
              html = fetch(url)
              if not html:
                  continue
              matches = re.findall(r'<a\s+href="([^"]+)"[^>]*>\s*([^<]{15,200})</a>', html, re.S)
              result = first_valid_match(matches)
              if not result:
                  continue
              link, title = result
              link = urllib.parse.urljoin(url, link)
              title = re.sub(r'\s+', ' ', title).strip()
              save_if_new(name, link, title, source_site, out_lines)

          print("\n".join(out_lines))
          EOF
          )

          if [ -n "$RESULTS" ]; then
            while IFS= read -r LINE; do
              [ -z "$LINE" ] && continue
              NAME="${LINE%%||*}"
              REST1="${LINE#*||}"
              TITLE="${REST1%%||*}"
              REST2="${REST1#*||}"
              LINK="${REST2%%||*}"
              SOURCE="${REST2##*||}"
              MESSAGE="📌 *${NAME} Update*%0A%0A${TITLE}%0A%0A📄 Notification/PDF: ${LINK}%0A🌐 Source Site: ${SOURCE}%0A📢 More updates: ${OWN_SITE}"

              TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d "chat_id=${CHANNEL_USERNAME}" \
                -d "text=${MESSAGE}" \
                -d "parse_mode=Markdown")
              echo "Telegram API response (${NAME}): $TG_RESPONSE"
            done <<< "$RESULTS"
          else
            echo "No new UPSC/SSC/IBPS/NTA/SBI/RRB updates found."
          fi

      - name: Commit updated state files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_link.txt last_UPSC.txt last_SSC.txt last_IBPS.txt last_NTA.txt last_SBI.txt last_RRB_Jammu.txt last_RRB_Central.txt last_JKSSB.txt last_JKHC.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update last posted links" && git push)

name: Send Sarkari Updates to Telegram
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sarkari-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
      OWN_SITE: "https://sarkarisevaportal.github.io/"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and Notify
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, re, os, json, time

          BOARDS = {
              "JKSSB": "https://jkssb.nic.in/Pages/WhatsNew.aspx",
              "JKPSC": "https://jkpsc.nic.in/LatestNews.html",
              "JKHC": "https://jkhighcourt.nic.in/recruitment.php",
              "SBI": "https://www.sbi.co.in/careers/current-openings",
              "UPSC": "https://upsc.gov.in/whats-new",
              "SSC": "https://ssc.gov.in/candidate-corner/tentative-answer-keys",
              "JammuUniv": "https://jammuuniversity.ac.in/notifications",
              "KashmirUniv": "https://kashmiruniversity.net/notifications.aspx",
              "CUJammu": "https://www.cujammu.ac.in/Notifications.aspx",
              "CUKashmir": "https://www.cukashmir.ac.in/",
              "BGSBU": "https://www.bgsbu.ac.in/recruitment.php",
              "SMVDU": "https://www.smvdu.ac.in/",
              "IUST": "https://www.iust.ac.in/",
              "SKUAST_J": "https://skuast.org/",
              "SKUAST_K": "https://www.skuastkashmir.ac.in/",
              "KVS": "https://kvsangathan.nic.in/recruitment",
              "NVS": "https://navodaya.gov.in/nvs/en/Recruitment/Notification-Vacancies/",
              "EMRS": "https://nests.tribal.gov.in/show_content.php?lang=1&level=1&ls_id=364&lid=148"
          }

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  return urllib.request.urlopen(req, timeout=20).read().decode("utf-8", errors="ignore")
              except: return ""

          def save_history(name, links):
              json.dump(links[:40], open(f"history_{name}.json", "w"))

          def load_history(name):
              if os.path.exists(f"history_{name}.json"):
                  try: return json.load(open(f"history_{name}.json"))
              except: return []
              return []

          for name, url in BOARDS.items():
              html = fetch(url)
              if not html: continue
              
              links = re.findall(r'<a\s+href="([^"]+)".*?>(.*?)</a>', html, re.S)
              history = load_history(name)
              new_found = False
              
              for link, title in links:
                  clean_title = re.sub(r'<[^>]+>', '', title).strip()
                  full_link = urllib.parse.urljoin(url, link)
                  
                  if len(clean_title) > 20 and full_link not in history:
                      # Send Message
                      msg = f"🆕 *New Update!*\n\n🏢 Dept: *{name}*\n📝 {clean_title}\n\n🔗 {full_link}"
                      enc_msg = urllib.parse.quote(msg)
                      os.system(f'curl -s -X POST https://api.telegram.org/bot${{BOT_TOKEN}}/sendMessage -d chat_id=${{CHANNEL_USERNAME}} -d text="{enc_msg}" -d parse_mode=Markdown > /dev/null')
                      
                      history.insert(0, full_link)
                      time.sleep(2) # Telegram anti-spam delay
                      new_found = True
                      if len(history) > 40: break 
              
              if new_found:
                  save_history(name, history)
          PYEOF
      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add history_*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update history files"
            git push
          fi

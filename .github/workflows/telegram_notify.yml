name: Send Sarkari Updates to Telegram
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
      OWN_SITE: "https://sarkarisevaportal.github.io/"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and Notify
        run: |
          pip install beautifulsoup4
          python3 - <<'PYEOF'
          import urllib.request, json, os, urllib.parse, time
          from bs4 import BeautifulSoup

          BOARDS = {
              "JKSSB": "https://jkssb.nic.in/Pages/WhatsNew.aspx",
              "JKPSC": "https://jkpsc.nic.in/LatestNews.html",
              "JKHC": "https://jkhighcourt.nic.in/recruitment.php",
              "SBI": "https://www.sbi.co.in/careers/current-openings",
              "UPSC": "https://upsc.gov.in/whats-new",
              "SSC": "https://ssc.gov.in/candidate-corner/tentative-answer-keys",
              "JammuUniv": "https://jammuuniversity.ac.in/notifications",
              "KashmirUniv": "https://kashmiruniversity.net/notifications.aspx",
              "CUJammu": "https://www.cujammu.ac.in/Notifications.aspx",
              "CUKashmir": "https://www.cukashmir.ac.in/",
              "BGSBU": "https://www.bgsbu.ac.in/recruitment.php",
              "SMVDU": "https://www.smvdu.ac.in/",
              "IUST": "https://www.iust.ac.in/",
              "SKUAST_J": "https://skuast.org/",
              "SKUAST_K": "https://www.skuastkashmir.ac.in/",
              "KVS": "https://kvsangathan.nic.in/recruitment",
              "NVS": "https://navodaya.gov.in/nvs/en/Recruitment/Notification-Vacancies/",
              "EMRS": "https://nests.tribal.gov.in/show_content.php?lang=1&level=1&ls_id=364&lid=148"
          }
          
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"}

          all_new_updates = []
          for name, url in BOARDS.items():
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  html = urllib.request.urlopen(req, timeout=15).read()
                  soup = BeautifulSoup(html, 'html.parser')
                  
                  hist_file = f"history_{name}.json"
                  history = json.load(open(hist_file)) if os.path.exists(hist_file) else []
                  
                  count = 0
                  for a in soup.find_all('a', href=True):
                      title = a.get_text(strip=True)
                      if len(title) > 20 and count < 3:
                          link = urllib.parse.urljoin(url, a['href'])
                          if link not in history:
                              all_new_updates.append({"name": name, "title": title, "link": link})
                              history.insert(0, link)
                              count += 1
                  json.dump(history[:30], open(hist_file, "w"))
              except: continue

          json.dump(all_new_updates, open("updates.json", "w"))
          PYEOF

          if [ -f updates.json ]; then
            python3 -c "
          import json, os, urllib.parse, time
          data = json.load(open('updates.json'))
          for r in data:
              msg = f'🆕 *New Update!*\n\n🏢 Dept: *{r['name']}*\n📝 {r['title']}\n\n🔗 {r['link']}\n\n📢 ${{OWN_SITE}}'
              msg_enc = urllib.parse.quote(msg)
              os.system(f'curl -s -X POST https://api.telegram.org/bot${{BOT_TOKEN}}/sendMessage -d chat_id=${{CHANNEL_USERNAME}} -d text=\"{msg_enc}\" -d parse_mode=Markdown > /dev/null')
              time.sleep(3)
          "
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add history_*.json 2>/dev/null || true
          git commit -m "Auto-update all boards" || true
          git push || true

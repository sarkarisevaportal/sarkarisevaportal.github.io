name: Send Sarkari Updates to Telegram

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: sarkari-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Scraper Engine
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
          OWN_SITE: "https://sarkarisevaportal.github.io/"
        run: |
          python3 scraper.py

      - name: Commit and Push History State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sent_history.json ]; then
            git add sent_history.json
            if ! git diff --cached --quiet; then
              git commit -m "Update notification history state [skip ci]"
              git pull --rebase origin main
              git push origin main
            else
              echo "No state changes to commit."
            fi
          fi

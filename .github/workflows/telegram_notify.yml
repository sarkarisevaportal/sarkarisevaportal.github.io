name: Send Sarkari Updates to Telegram
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Updates
        run: |
          python3 -c "
          import urllib.request, re, json, os, time, urllib.parse
          
          # Sirf 5 main websites rakhi hain taaki timeout na ho
          BOARDS = {
              'JKSSB': 'https://jkssb.nic.in/Pages/WhatsNew.aspx',
              'SBI': 'https://www.sbi.co.in/careers/current-openings',
              'JKPSC': 'https://jkpsc.nic.in/LatestNews.html',
              'UPSC': 'https://upsc.gov.in/whats-new',
              'KVS': 'https://kvsangathan.nic.in/recruitment'
          }
          
          HEADERS = {'User-Agent': 'Mozilla/5.0'}
          
          for name, url in BOARDS.items():
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=10) as response:
                      html = response.read().decode('utf-8', errors='ignore')
                      
                  hist_file = f'history_{name}.json'
                  history = json.load(open(hist_file)) if os.path.exists(hist_file) else []
                  
                  # Regex jo link aur title uthaye
                  matches = re.findall(r'<a\s+href=[\'\"]([^\'\"]+)[\'\"][^>]*>(.*?)</a>', html, re.I | re.S)
                  
                  count = 0
                  for link, title in matches:
                      clean_title = re.sub(r'<[^>]+>', '', title).strip()
                      full_link = urllib.parse.urljoin(url, link)
                      
                      if len(clean_title) > 20 and full_link not in history and count < 2:
                          msg = f'🆕 *New Update*\n\nDept: {name}\nUpdate: {clean_title}\n\n{full_link}'
                          # Telegram API call
                          params = urllib.parse.urlencode({'chat_id': '${{secrets.TELEGRAM_TOKEN}}', 'text': msg, 'parse_mode': 'Markdown'})
                          # Yahan direct request bhejein
                          history.insert(0, full_link)
                          count += 1
                          time.sleep(1)
                          
                  json.dump(history[:20], open(hist_file, 'w'))
              except Exception as e:
                  print(f'Error on {name}: {e}')
          "

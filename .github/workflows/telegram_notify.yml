name: Send Sarkari Updates to Telegram
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_USERNAME: "@sarkarisevaportaljkssb"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch and Notify
        run: |
          RESULT=$(python3 - <<'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          import time

          url = "https://www.indiagovtjobs.in/feeds/posts/default"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; SarkariSevaBot/1.0)"}

          root = None
          last_error = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  resp = urllib.request.urlopen(req, timeout=15)
                  root = ET.parse(resp).getroot()
                  break
              except Exception as e:
                  last_error = e
                  if attempt < 2:
                      time.sleep(5)

          if root is None:
              print(f"FAILED_FETCH: {last_error}")
              exit(0)

          ns = {'atom': 'http://www.w3.org/2005/Atom'}
          entry = root.find('atom:entry', ns)
          title = entry.find('atom:title', ns).text
          link = entry.find("atom:link[@rel='alternate']", ns).get('href')

          if os.path.exists("last_link.txt"):
              with open("last_link.txt", "r") as f:
                  if f.read().strip() == link:
                      exit(0)

          with open("last_link.txt", "w") as f:
              f.write(link)
          print(f"{title}||{link}")
          EOF
          )

          if [[ "$RESULT" == FAILED_FETCH:* ]]; then
            echo "Fetch failed after retries: $RESULT"
            exit 0
          fi

          if [ -n "$RESULT" ]; then
            TITLE="${RESULT%%||*}"
            LINK="${RESULT##*||}"
            MESSAGE="📌 *Nayi Sarkari Update*%0A%0A${TITLE}%0A%0A🔗 ${LINK}"

            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHANNEL_USERNAME}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown"

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add last_link.txt
            git commit -m "Update last posted link"
            git push
          else
            echo "No new post found. Skipping."
          fi
